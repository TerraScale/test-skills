name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate skills
        run: node scripts/validate-skills.mjs
      - name: Check CLI discovery
        run: node scripts/validate-skills.mjs --cli-list
        env:
          DISABLE_TELEMETRY: 1

  all-green:
    name: all-green
    needs: [validate]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require successful validation
        env:
          VALIDATION_RESULT: ${{ needs.validate.result }}
        run: test "$VALIDATION_RESULT" = success
